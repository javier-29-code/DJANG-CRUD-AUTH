{% extends "base.html" %}

{% block title %}Crear cuenta{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-5">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h1 class="h3 mb-4">Crear cuenta</h1>

                <form method="post">
                    {% csrf_token %}
                    {% include "form_fields.html" %}

                    <button class="btn btn-primary w-100" type="submit">
                        Registrarse
                    </button>
                </form>

                <p class="mt-3 mb-0">
                    ¿Ya tienes cuenta?
                    <a href="{% url 'iniciar_sesion' %}">
                        Iniciar sesión
                    </a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
