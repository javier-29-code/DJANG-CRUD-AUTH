<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Gestor de tareas{% endblock %}</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous"
    >
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark">
        <div class="container d-flex flex-wrap gap-3">
            <a class="navbar-brand" href="{% url 'inicio' %}">
                Gestor de tareas
            </a>

            <div class="d-flex flex-wrap align-items-center gap-3">
                {% if user.is_authenticated %}
                    <a class="text-white" href="{% url 'tareas' %}">
                        Pendientes
                    </a>
                    <a class="text-white" href="{% url 'tareas_completadas' %}">
                        Completadas
                    </a>
                    <a class="btn btn-primary" href="{% url 'crear_tarea' %}">
                        Crear tarea
                    </a>

                    <form action="{% url 'cerrar_sesion' %}" method="post">
                        {% csrf_token %}
                        <button class="btn btn-outline-light" type="submit">
                            Cerrar sesión
                        </button>
                    </form>
                {% else %}
                    <a class="text-white" href="{% url 'iniciar_sesion' %}">
                        Iniciar sesión
                    </a>
                    <a class="btn btn-primary" href="{% url 'registro' %}">
                        Registrarse
                    </a>
                {% endif %}
            </div>
        </div>
    </nav>

    <main class="container py-5">
        {% block content %}
        {% endblock %}
    </main>
</body>
</html>
